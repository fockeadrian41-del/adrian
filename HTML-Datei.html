<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine erste Website</title>
    <style>
        /* Hier kommt das Design (CSS) hin */
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }

        h1 {
            color: #00ffcc;
            font-size: 2rem;
        }

        p {
            font-size: 1.1rem;
            color: #cccccc;
        }

        .karte {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        button {
            background-color: #00ffcc;
            color: #1a1a1a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:active {
            background-color: #00cc99;
        }
    </style>
</head>
<body>

    <!-- Hier kommt der Inhalt (HTML) hin -->
    <div class="karte">
        <h1>Hallo Welt! 🚀</h1>
        <p>Das ist meine erste Webseite, die ich direkt auf meinem Samsung Galaxy A13 programmiert habe.</p>
        <button onclick="alert('Klick hat funktioniert!')">Klick mich</button>
    </div>

</body>
</html>
